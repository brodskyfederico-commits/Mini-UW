name: Candidate model references and source integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reference-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-reference.txt
      - name: Verify package and synthetic references
        run: python tools/check_reference_package.py
      - name: Reject deliberate structural inconsistencies
        run: python tools/check_structure_faults.py
      - name: Verify current model structure and original field crosswalk
        run: python tools/check_current_structure_D04.py
      - name: Verify dependency structure and observed revision impact
        run: python tools/check_dependency_structure_D05.py
      - name: Verify blocking structure and current figure withdrawal
        run: python tools/check_blocking_structure_D06.py
      - name: Verify investor output contract and annual cash presentation
        run: python tools/check_investor_output_D07.py
      - name: Verify investor package source-first recovery
        run: python tools/check_investor_package_T97.py
      - name: Verify capital visibility and source-first output recovery
        run: python tools/check_capital_output_T98.py
      - name: Verify exhaustive event and annual one-page output
        run: python tools/check_long_output_T99.py
      - name: Verify primitive IRR output and independent sparse certificate
        run: python tools/check_IRR_output_T100.py
      - name: Verify IRR interval conditions and retained pending bands
        run: python tools/check_IRR_interval_T101.py
      - name: Verify two-source IRR revision review and blocked candidate recovery
        run: python tools/check_IRR_revision_review_T102.py
      - name: Verify original worksheet case consistency and current figure withdrawal
        run: python tools/check_worksheet_case_T103.py
      - name: Verify hypothetical cash participation and independent IRR certificates
        run: python tools/check_cash_participation_T104.py
      - name: Verify participant cash risk and dated source reconciliation
        run: python tools/check_participant_cash_risk_T105.py
      - name: Verify nominal insurance settlement and independent cutoff reconciliation
        run: python tools/check_deferred_insurance_T106.py
      - name: Verify insurance terminal binding and independent closing cash oracles
        run: python tools/check_insurance_terminal_T107.py
      - name: Verify settled operating stocks sale and full synthetic cash return
        run: python tools/check_settled_lifecycle_T108.py
      - name: Verify settled source currentness one-page output and blocked recovery
        run: python tools/check_current_settled_T109.py
      - name: Verify phased rent nominal policies settled cash and current one-page recovery
        run: python tools/check_phased_settled_T110.py
      - name: Verify original55 worksheet claims settled return and source-first current output
        run: python tools/check_worksheet_settled_T111.py
      - name: Verify one-page Dot and bot role summary
        run: python tools/check_dots_bots_onepage_ROLES01.py
      - name: Verify reproducible operating cash reconciliation
        run: python tools/check_operating_replay_D20.py
      - name: Verify reproducible debt and sale reconciliation
        run: python tools/check_debt_sale_replay_D21.py
      - name: Verify integrated synthetic debt, operating cash and sale reconciliation
        run: python tools/check_integrated_replay_D22.py
      - name: Verify integrated synthetic project equity cash return
        run: python tools/check_return_replay_D23.py
      - name: Verify bounded annual project equity IRR from integrated cash
        run: python tools/check_annual_return_replay_D24.py
      - name: Reject synthetic equity and IRR handoff faults
        run: python tools/check_return_handoff_faults_D25.py
      - name: Verify synthetic refinance bridge, capacity gate and equity cash
        run: python tools/check_refinance_return_replay_D26.py
      - name: Verify declared synthetic capital cuts and conditional CoC
        run: python tools/check_capital_coc_replay_D27.py
      - name: Verify integrated synthetic participant cash allocations
        run: python tools/check_integrated_participation_D28.py --summary
      - name: Verify synthetic participant funding peaks and sale dependence
        run: python tools/check_participant_funding_risk_D29.py --summary
      - name: Verify participant funding and returns across archived sale revisions
        run: python tools/check_participant_sale_revisions_D30.py --summary
      - name: Verify participant cash and risk under refinance sensitivities
        run: python tools/check_participant_refinance_variants_D31.py --summary
      - name: Verify joint refinance and sale sensitivities by participant
        run: python tools/check_participant_joint_exit_D32.py --summary
      - name: Verify exact sale prices for synthetic participant cash recovery
        run: python tools/check_sale_cash_recovery_D33.py --summary
      - name: Verify discounted cash recovery prices on the synthetic sale calendar
        run: python tools/check_discounted_sale_recovery_D34.py --summary
      - name: Verify the refinance price crossover across synthetic discount rates
        run: python tools/check_discount_rate_crossover_D35.py --summary
      - name: Verify synthetic bank NOI capacity boundaries and discount comparison
        run: python tools/check_bank_noi_capacity_order_D36.py --summary
      - name: Verify LTV boundaries and exact ties with synthetic DSCR capacity
        run: python tools/check_ltv_capacity_order_D37.py --summary
      - name: Verify joint synthetic bank and valuation NOI capacity
        run: python tools/check_joint_noi_capacity_D38.py --summary
      - name: Verify participant returns and blocked cases across the joint NOI matrix
        run: python tools/check_joint_noi_investor_returns_D39.py --summary
      - name: Verify joint NOI capacity and participant recovery across sale revisions
        run: python tools/check_joint_noi_sale_returns_D40.py --summary
      - name: Verify dated discounted recovery across the joint NOI and sale matrix
        run: python tools/check_joint_noi_discounted_returns_D41.py --summary
      - name: Verify discounted sale recovery prices and capacity blocks
        run: python tools/check_joint_noi_recovery_prices_D42.py --summary
      - name: Verify worksheet sale recovery against dated cash and blocked sources
        run: python tools/check_worksheet_sale_recovery_D43.py --summary
      - name: Verify single-page worksheet recovery figures and withdrawal
        run: python tools/check_worksheet_recovery_page_D44.py --summary
      - name: Verify worksheet-sourced refinance capacity and one-page cash output
        run: python tools/check_worksheet_refinance_D45.py --summary
      - name: Verify discounted recovery on the refinanced worksheet page
        run: python tools/check_worksheet_refinance_recovery_D46.py
      - name: Verify the unified worksheet CLI, audited outputs and blocked cases
        run: python tools/check_unified_worksheet_D48.py
      - name: Verify first synthetic pilot and editable screening comparison workbook
        run: python tools/check_first_pilot_D49.py
      - name: Verify the refinance pilot in the common PASS FAIL workbook
        run: python tools/check_refinance_pilot_D50.py
      - name: Verify the Base and Downside multi-metric pilot in the common workbook
        run: python tools/check_scenario_pilot_D51.py
      - name: Verify the complete Base and Downside pilot package and tamper rejection
        run: python tools/check_scenario_package_D52.py
      - name: Verify the filled synthetic Cotejo against source-bound pilot evidence
        run: python tools/check_cotejo_review_D53.py
      - name: Verify the filled worksheet handoff against the delivered audited scenario package
        run: python tools/check_linked_cotejo_D54.py
      - name: Verify linked Cotejo discrepancy details and source pointers
        run: python tools/check_cotejo_diagnostics_D55.py
      - name: Verify Cotejo corrections and rerun against the same audited package
        run: python tools/check_cotejo_corrections_D56.py
      - name: Verify that Cotejo follows the designated synthetic pilot revision
        run: python tools/check_cotejo_revision_D57.py
      - name: Verify Downside threshold revision and stale worksheet handling
        run: python tools/check_downside_threshold_revision_D58.py
      - name: Verify synthetic current revision registration and workbook withdrawal
        run: python tools/check_current_cotejo_D59.py
      - name: Verify atomic current-revision check before synthetic Cotejo publication
        run: python tools/check_current_publication_D60.py
      - name: Verify historical and current synthetic Cotejo report audit
        run: python tools/check_historical_cotejo_D61.py
      - name: Verify worksheet exit cap through forward NOI, closing and guarded cash
        run: python tools/check_worksheet_exit_D62.py
      - name: Verify worksheet sale costs through valuation and net equity cash
        run: python tools/check_worksheet_sale_costs_D63.py
      - name: Verify discounted worksheet recovery with fixed and percentage sale costs
        run: python tools/check_discounted_worksheet_sale_D64.py
      - name: Verify worksheet exit and cost in the unified audited one-page case
        run: python tools/check_unified_costed_sale_D65.py
      - name: Verify worksheet sale pending reasons and prior PDF replay
        run: python tools/check_costed_sale_diagnostics_D67.py
      - name: Verify dated synthetic participant cash in the common worksheet package
        run: python tools/check_worksheet_participation_D68.py
      - name: Verify stabilized synthetic YoC and reference cap spread
        run: python tools/check_yoc_spread_D70.py
      - name: Verify applied equity and debt reconcile to the synthetic total cost
        run: python tools/check_equity_tdc_D71.py
      - name: Verify synthetic break-even occupancy against operating NOI
        run: python tools/check_breakeven_occupancy_D72.py
      - name: Verify illustrative participant returns per USD 10 initial equity
        run: python tools/check_worksheet_investor_D74.py
      - name: Verify Base and Downside returns per USD 10 of initial equity
        run: python tools/check_investor_scenarios_D75.py
      - name: Verify historical investor report reissues on USD 10 initial equity
        run: python tools/reissue_investor_reports_D76.py
      - name: Verify all four USD 10 answers in corrected investor reports
        run: python tools/check_investor_answers_D77.py
      - name: Verify the eight pending investor reports and their synthetic variants
        run: python tools/check_pending_investor_answers_D78.py
      - name: Audit one-page USD 10 report for eight pending cases
        run: python tools/onepage_pending_cases_D79.py
      - name: Verify the exact USD 10 initial contribution across reports and variants
        run: python tools/check_initial_equity_basis_D80.py
      - name: Audit the eight corrected synthetic investor revisions
        run: python tools/revise_pending_investor_reports_D81.py
      - name: Verify sale recovery thresholds for USD 10 in Base and Downside
        run: python tools/check_scenario_recovery_D82.py
      - name: Verify dated discounted recovery per USD 10 in Base and Downside
        run: python tools/check_discounted_scenario_recovery_D83.py
      - name: Verify the three-rate USD 10 sale sensitivity
        run: python tools/check_sale_rate_grid_D84.py
      - name: Verify USD 10 sale cash surplus and shortfall by discount rate
        run: python tools/check_sale_gap_D85.py
      - name: Verify refinance cost recovery thresholds in synthetic Downside
        run: python tools/refinance_cost_recovery_D86.py
      - name: Verify combined refinance cost and gross sale recovery in synthetic Downside
        run: python tools/refinance_sale_combinations_D87.py
      - name: Verify price-linked sale closing costs and synthetic Downside recovery
        run: python tools/price_linked_sale_cost_D88.py
      - name: Verify three price-linked sale fee rates and synthetic Downside recovery
        run: python tools/sale_cost_rate_grid_D89.py
      - name: Verify dated USD 10 receipts and gaps at fixed synthetic sale price
        run: python tools/fixed_sale_cash_D90.py
      - name: Verify synthetic refinance cost ceilings at a fixed sale price
        run: python tools/fixed_sale_refinance_limit_D91.py
      - name: Verify isolated delayed sale receipt and USD 10 recovery gaps
        run: python tools/fixed_sale_delay_D92.py
      - name: Verify holding costs and debt maturity through a delayed synthetic sale
        run: python tools/delayed_sale_carry_D93.py
      - name: Verify minimum delayed sale prices after holding costs and debt maturity
        run: python tools/delayed_sale_recovery_D94.py
      - name: Verify minimum refinance cost cuts at a fixed delayed sale price
        run: python tools/delayed_sale_refinance_reduction_D95.py
      - name: Verify combined refinance and sale price thresholds after a synthetic delay
        run: python tools/delayed_exit_combinations_D96.py
      - name: Verify sale recovery prices across three monthly holding costs
        run: python tools/holding_cost_sale_recovery_D97.py
      - name: Verify fixed sale receipts and gaps across holding costs and delays
        run: python tools/fixed_sale_holding_grid_D98.py
      - name: Verify extended sale delays, year rollover and retained cash limits
        run: python tools/extended_holding_sale_D99.py
      - name: Verify fixed sale cash and discounted gaps after extended delays
        run: python tools/fixed_extended_sale_D100.py
      - name: Verify first holding cash shortfalls and explicit synthetic equity contributions
        run: python tools/holding_cash_funding_boundary_D101.py
      - name: Verify the complete synthetic USD 10 workflow and recovery boundaries
        run: python tools/check_integral_miniuw_D102.py
      - name: Verify synthetic USD 10 scenario withholding when refinance is blocked
        run: python tools/check_scenario_availability_D104.py
      - name: Verify declared synthetic plan schedule revisions
        run: PYTHONPATH=src python tools/plan_schedule_D105.py check
      - name: Verify synthetic plan revisions' rent and cost impact
        run: PYTHONPATH=src python tools/plan_impact_D106.py check
      - name: Verify synthetic plan revisions through Base and Downside USD 10 cash
        run: PYTHONPATH=src python tools/plan_return_D107.py check
      - name: Verify plan revisions through refinance capacity and USD 10 cash
        run: PYTHONPATH=src python tools/plan_refinance_D108.py check
      - name: Verify the revised-plan refinance request through the worksheet and PDF audit
        run: PYTHONPATH=src python tools/check_plan_refinance_request_D109.py
      - name: Verify the one-page revised-plan comparison with and without refinance
        run: PYTHONPATH=src python tools/compare_revised_plan_D110.py
      - name: Verify the one-page revised-plan monthly refinance crossover
        run: PYTHONPATH=src python tools/compare_refinance_discount_D111.py
      - name: Verify the selected-rate revised-plan comparison through the worksheet and PDF audit
        run: PYTHONPATH=src python tools/check_plan_discount_D112.py
      - name: Verify revised-plan sale recovery at the selected monthly discount rate
        run: PYTHONPATH=src python tools/check_plan_sale_recovery_D113.py
      - name: Verify the expected-sale gap to the discounted recovery minimum
        run: PYTHONPATH=src python tools/compare_sale_to_minimum_D114.py
      - name: Test synthetic technical foundation
        run: PYTHONPATH=src python -m unittest discover -s tests -v
