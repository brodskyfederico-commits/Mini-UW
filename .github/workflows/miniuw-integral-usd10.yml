name: Mini-UW USD 10 integration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/miniuw-integral-usd10.yml
      - tools/check_integral_miniuw_D102.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integral-usd10:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reference-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-reference.txt
      - name: Verify integral synthetic cash for USD 10
        run: python tools/check_integral_miniuw_D102.py
